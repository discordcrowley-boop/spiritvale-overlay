<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Menu</title>
    <style>
      :root {
        color-scheme: dark;
        --text: #e8eaed;
        --muted: #8b919a;
        --mint: #3ee0b0;
        --line: rgba(255, 255, 255, 0.08);
        --bg: rgba(14, 16, 18, 0.98);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      .dock-menu {
        box-sizing: border-box;
        width: 100%;
        max-height: 100vh;
        overflow: auto;
        padding: 6px;
        background: var(--bg);
        border: 1px solid rgba(62, 224, 176, 0.32);
        border-radius: 6px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
        color: var(--text);
        font-size: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 0, 0, 0.55) transparent;
      }

      .hud-settings-head {
        font-weight: 700;
        margin: 6px 6px 4px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--mint);
      }

      .hud-settings-hint {
        margin: 0 6px 6px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }

      .hud-settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0;
        padding: 6px 8px;
        border-radius: 4px;
      }

      .hud-settings-row:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .hud-scale {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .hud-scale-btn {
        appearance: none;
        border: 1px solid rgba(62, 224, 176, 0.35);
        background: rgba(62, 224, 176, 0.1);
        color: var(--mint);
        border-radius: 999px;
        width: 22px;
        height: 22px;
        cursor: pointer;
        font-weight: 700;
        line-height: 1;
      }

      .hud-scale b {
        min-width: 36px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .hud-toggle {
        display: inline-flex;
        align-items: center;
      }

      .hud-dim-range {
        width: calc(100% - 16px);
        margin: 0 8px 6px;
        accent-color: var(--mint);
      }

      .hud-menu-toggles {
        display: grid;
        gap: 2px;
        margin-bottom: 4px;
      }

      .hud-menu-toggle,
      .hud-menu-move {
        appearance: none;
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
        padding: 7px 8px;
        border-radius: 4px;
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
      }

      .hud-menu-toggle:hover,
      .hud-menu-move:hover {
        background: rgba(62, 224, 176, 0.1);
      }

      .hud-menu-toggle.on {
        background: rgba(62, 224, 176, 0.12);
      }

      .hud-menu-toggle-copy {
        display: grid;
        gap: 1px;
        min-width: 0;
      }

      .hud-menu-toggle-copy strong {
        font-size: 12px;
        font-weight: 650;
      }

      .hud-menu-toggle-copy small {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.3;
        font-weight: 500;
      }

      .hud-menu-toggle-state {
        flex: 0 0 auto;
        min-width: 26px;
        text-align: right;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        padding-top: 2px;
      }

      .hud-menu-toggle.on .hud-menu-toggle-state {
        color: #7dffc9;
      }

      .hud-menu-move {
        cursor: grab;
      }

      .hud-menu-move:active {
        cursor: grabbing;
      }

      .hud-menu-move-glyph {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        color: #9aa0a8;
        padding-top: 2px;
      }

      .hud-menu-move-glyph svg {
        width: 13px;
        height: 13px;
        display: block;
      }

      .hud-legend {
        display: grid;
        gap: 4px;
        margin: 4px 8px 8px;
        max-height: 120px;
        overflow: auto;
      }

      .hud-legend-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }

      .hud-legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .dock-section {
        margin: 4px 0;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.18);
      }

      .dock-section-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 4px;
        cursor: pointer;
      }

      .dock-section-head strong {
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .dock-fields {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-left: 2px;
      }

      .dock-field {
        display: grid;
        grid-template-columns: 16px 1fr;
        gap: 8px;
        align-items: center;
        margin: 0;
        padding: 4px 6px;
        cursor: pointer;
        font-size: 0.78rem;
        border-radius: 4px;
      }

      .dock-field:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .dock-field span {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .dock-field i {
        font-style: normal;
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .dock-field.main span {
        font-weight: 650;
      }

      .dock-field input:disabled + span {
        opacity: 0.45;
      }

      label.hud-settings-row {
        cursor: pointer;
      }

      .hud-pick-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        margin: 0 6px 6px;
      }

      .hud-pick {
        appearance: none;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding: 5px 6px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font: 600 11px/1.2 "Segoe UI", system-ui, sans-serif;
        text-align: left;
        cursor: pointer;
      }

      .hud-pick span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hud-pick:hover {
        background: rgba(62, 224, 176, 0.1);
      }

      .hud-pick.on {
        border-color: rgba(62, 224, 176, 0.6);
        background: rgba(62, 224, 176, 0.14);
      }

      .hud-pick-swatch {
        flex: 0 0 auto;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        box-shadow: 0 0 6px currentColor;
      }
    </style>
  </head>
  <body>
    <div class="dock-menu hud-settings" id="menu"></div>
    <script src="./dock-menu.js"></script>
  </body>
</html>
