<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loot Tip</title>
    <link rel="stylesheet" href="./loot.css" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      .floating-tip {
        width: 100%;
        height: auto;
        overflow: hidden;
        padding: 8px 10px;
        background: rgba(8, 8, 10, calc(0.42 + var(--hud-look, 0.4) * 0.54));
        border: 1px solid rgba(58, 58, 58, calc(0.35 + var(--hud-look, 0.4) * 0.65));
        border-radius: var(--hud-radius, 10px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, calc(var(--hud-look, 0.4) * 0.5));
      }
    </style>
  </head>
  <body>
    <div class="floating-tip tip" id="tip"></div>
    <script>
      const tip = document.getElementById("tip");

      function applyTipScale(scale) {
        const next = Math.min(2.2, Math.max(0.9, Number(scale) || 1.35));
        document.documentElement.style.setProperty("--tip-scale", String(next));
        return next;
      }

      function applyLook(payload) {
        if (payload?.hudLook != null) {
          document.documentElement.style.setProperty("--hud-look", String(payload.hudLook));
        }
        if (payload?.hudCorners) {
          const corners = payload.hudCorners === "square" ? "square" : "round";
          document.documentElement.dataset.corners = corners;
          document.documentElement.style.setProperty("--hud-radius", corners === "square" ? "0px" : "14px");
        }
      }

      function waitForImages() {
        const images = [...tip.querySelectorAll("img")];
        return Promise.all(
          images.map((img) => {
            if (img.complete) return Promise.resolve();
            return new Promise((resolve) => {
              img.addEventListener("load", resolve, { once: true });
              img.addEventListener("error", resolve, { once: true });
            });
          }),
        );
      }

      function bindIcons() {
        tip.querySelectorAll("img.icon").forEach((img) => {
          img.addEventListener("error", () => {
            const fallbacks = String(img.dataset.fallbacks || "")
              .split("|")
              .map((url) => url.trim())
              .filter(Boolean);
            if (fallbacks.length) {
              img.dataset.fallbacks = fallbacks.slice(1).join("|");
              img.src = fallbacks[0];
              return;
            }
            const fallback = document.createElement("div");
            fallback.className = "icon missing";
            fallback.textContent = "?";
            img.replaceWith(fallback);
            fitWindow();
          });
        });
      }

      async function fitWindow() {
        if (!tip.innerHTML.trim()) return;
        await waitForImages();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const height = Math.ceil(Math.max(tip.scrollHeight, tip.getBoundingClientRect().height));
        const isStatus = Boolean(tip.querySelector(".sv-tip"));
        await window.overlayHud?.fitLootTip?.({
          width: isStatus ? 248 : 300,
          height,
        });
      }

      applyTipScale(1.35);
      if (window.overlayHud?.getHudPrefs) {
        window.overlayHud
          .getHudPrefs("farm")
          .then((prefs) => {
            applyTipScale(prefs?.tipScale);
            applyLook(prefs);
          })
          .catch(() => {});
      }
      if (window.overlayHud?.onTipScale) {
        window.overlayHud.onTipScale((payload) => {
          applyTipScale(payload?.tipScale);
          fitWindow();
        });
      }
      if (window.overlayHud?.onHudLook) {
        window.overlayHud.onHudLook((payload) => applyLook(payload || {}));
      }
      if (window.overlayHud?.onLootTip) {
        window.overlayHud.onLootTip((payload) => {
          tip.innerHTML = payload?.html || "";
          bindIcons();
          fitWindow();
        });
      }
    </script>
  </body>
</html>
