<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kills!</title>
    <link rel="stylesheet" href="./hud-base.css" />
    <link rel="stylesheet" href="./kill-counter.css" />
  </head>
  <body>
    <div class="details kill-counter" id="meter">
      <header class="titlebar">
        <div class="brand-wrap">
          <div class="brand">Kills!</div>
          <div class="sub" id="subLabel">Session · since reset</div>
        </div>
        <div class="title-actions no-drag">
          <button type="button" id="reset" title="Reset">↺</button>
          <button type="button" id="close" title="Close">✕</button>
        </div>
      </header>

      <div class="summary">
        <div class="stat total">
          <span>Kills</span>
          <b id="killTotal">0</b>
        </div>
        <div class="stat rate">
          <span>Kills/hr</span>
          <b id="killRate">0</b>
        </div>
      </div>

      <div class="list-head">
        <span>Monster</span>
        <span>Count</span>
      </div>
      <div class="list" id="killList">
        <p class="empty">No kills yet — damage a mob until it dies.</p>
      </div>
    </div>
    <script src="./hud-chrome.js"></script>
    <script src="./kill-counter.js"></script>
  </body>
</html>
